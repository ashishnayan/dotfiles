
[colors]
draw_bold_text_with_bright_colors = true

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
# TERM = "alacritty"
# TERM =  "wezterm"
TERM = "xterm-256color"

[font]
builtin_box_drawing = true
size = 20.0

[font.bold]
family = "SauceCodePro Nerd Font"
style = "Medium"

[font.bold_italic]
family = "SauceCodePro Nerd Font"
style = "Medium Italic"

[font.glyph_offset]
x = 0
y = 1

[font.italic]
family = "SauceCodePro Nerd Font"
style = "Light Italic"

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Light"

[font.offset]
x = 1
y = 2

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
decorations = "Buttonless"
opacity = 0.98
option_as_alt = "OnlyLeft"
startup_mode = "SimpleFullscreen"

[window.padding]
x = 3
y = 1

[general]
live_config_reload = true
# custom_cursor_colors = true
import = ["/Users/ashishnayan/.config/alacritty/colors/catppuccin-mocha.toml"]
# import = ["/Users/ashishnayan/.config/alacritty/colors/cobalt2.toml"]
