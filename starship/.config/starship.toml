# ~/.config/starship.toml
# Catppuccin Mocha palette, two-line prompt, Nerd Font icons (SauceCodePro NF).
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000
palette = "catppuccin_mocha"

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$git_metrics\
$aws\
$kubernetes\
$line_break\
$sudo\
$jobs\
$status\
$character"""

right_format = """
$python\
$nodejs\
$java\
$rust\
$docker_context\
$line_break\
$cmd_duration\
"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

# ── Left side ────────────────────────────────────────────────────────────────

[os]
disabled = false
format = "[$symbol]($style) "
style = "subtext0"

[os.symbols]
Macos = ""
Linux = ""
Ubuntu = ""
Debian = ""

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " "
read_only_style = "red"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"~/projects" = " proj"
"~/.config" = " config"
"Documents" = "󰈙 "
"Downloads" = " "

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold mauve"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "peach"
conflicted = ""
ahead = "${count}"
behind = "${count}"
diverged = "${ahead_count}${behind_count}"
untracked = "${count}"
stashed = "${count}"
modified = "${count}"
staged = "${count}"
renamed = "${count}"
deleted = "${count}"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
style = "yellow"
rebase = " rebasing"
merge = " merging"
cherry_pick = "cherry-picking"

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

# ── Languages / runtimes (only shown when the project uses them) ─────────────

[python]
symbol = " "
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "yellow"
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "setup.py", "Pipfile", "manage.py", "uv.lock"]
detect_folders = [".venv"]
version_format = "${major}.${minor}"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "green"
version_format = "${major}"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "red"
version_format = "${major}"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "peach"
version_format = "${major}.${minor}"

# ── Infra context ────────────────────────────────────────────────────────────

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "sapphire"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml", "Dockerfile"]

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[$symbol$context( \\($namespace\\))]($style) "
style = "sky"
# Only show when inside a project that looks k8s-ish, or when env is set.
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml"]
detect_folders = ["k8s", "kubernetes", "helm", "charts"]
detect_env_vars = ["KUBECONFIG"]

[aws]
# Icon lives inside the profile group so nothing shows when only a default
# region is configured in ~/.aws/config.
format = "([ $profile(\\[$duration\\])]($style) )"
style = "peach"
force_display = false
expiration_symbol = "󰅐"

[aws.region_aliases]
ap-southeast-1 = "sg"
ap-southeast-2 = "syd"
us-east-1 = "va"
us-west-2 = "or"
af-south-1 = "cpt"

# ── Status / timing ──────────────────────────────────────────────────────────

[cmd_duration]
min_time = 2_000
format = "[󰔛 $duration]($style) "
style = "yellow"
show_notifications = false

[sudo]
disabled = false
symbol = " "
format = "[$symbol]($style)"
style = "bold red"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = " "
not_executable_symbol = " "
not_found_symbol = " "
sigint_symbol = " "
signal_symbol = " "
style = "bold red"
map_symbol = true
pipestatus = true
pipestatus_format = "\\[$pipestatus\\] => [$symbol$common_meaning$signal_name$maybe_int]($style) "

[jobs]
symbol = " "
format = "[$symbol$number]($style) "
style = "lavender"
number_threshold = 1

[time]
disabled = false
format = "[ $time]($style)"
style = "overlay1"
time_format = "%H:%M"

# Prompt character doubles as a vi-mode indicator (you use `bindkey -v`).
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
vimcmd_replace_one_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold yellow)"
vimcmd_visual_symbol = "[❮](bold peach)"

# Modules you don't need cluttering the prompt
[username]
disabled = true
[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "bold red"
[package]
disabled = true
[battery]
disabled = true
